name: CI

on:
  push:
    branches: [main, standardize-repo]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libboost-all-dev \
            lcov

      - name: Build
        run: make

      - name: Build with coverage
        run: make coverage-build

      - name: Generate coverage report
        run: make coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 30

      - name: Upload coverage info
        uses: actions/upload-artifact@v4
        with:
          name: coverage-info
          path: coverage-build/coverage.info
          retention-days: 30

  package:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libboost-coroutine-dev \
            libboost-context-dev \
            dpkg-dev \
            fakeroot

      - name: Build project
        run: |
          cmake -B build -S . -GNinja -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build

      - name: Create deb package
        run: |
          PKG_DIR=$(mktemp -d)
          mkdir -p "${PKG_DIR}/usr/bin"
          mkdir -p "${PKG_DIR}/lib/systemd/system"
          mkdir -p "${PKG_DIR}/etc/gkiosk"
          mkdir -p "${PKG_DIR}/DEBIAN"

          cp build/gKiosk "${PKG_DIR}/usr/bin/gkiosk"
          chmod 0755 "${PKG_DIR}/usr/bin/gkiosk"

          cp gkiosk.service "${PKG_DIR}/lib/systemd/system/gkiosk.service"
          chmod 0644 "${PKG_DIR}/lib/systemd/system/gkiosk.service"

          printf '%s\n' \
            "Package: gkiosk" \
            "Version: 1.0.0" \
            "Section: web" \
            "Priority: optional" \
            "Architecture: amd64" \
            "Depends: libgtk-3-0, libwebkit2gtk-4.1-0" \
            "Maintainer: gKiosk Developers <dev@example.com>" \
            "Description: Lightweight fullscreen kiosk web browser" \
            " gKiosk is a GTK3/WebKit2 kiosk browser for Linux that displays a" \
            " fullscreen web page. Features persistent cookies and gamepad support." \
            > "${PKG_DIR}/DEBIAN/control"

          cp debian/postinst "${PKG_DIR}/DEBIAN/postinst"
          chmod 0755 "${PKG_DIR}/DEBIAN/postinst"

          fakeroot dpkg-deb --build "${PKG_DIR}" gkiosk_1.0.0_amd64.deb

      - name: Upload deb package
        uses: actions/upload-artifact@v4
        with:
          name: gkiosk-deb
          path: gkiosk_1.0.0_amd64.deb
          retention-days: 90

  nixos-image:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-24.11
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build NixOS ISO image
        run: nix build .#iso --out-link result

      - name: Copy ISO
        run: cp result/iso/gkiosk.iso gkiosk.iso

      - name: Upload NixOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: gkiosk-nixos-iso
          path: gkiosk.iso
          retention-days: 90

  release:
    runs-on: ubuntu-latest
    needs: [package, nixos-image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download deb package
        uses: actions/download-artifact@v4
        with:
          name: gkiosk-deb

      - name: Download NixOS ISO
        uses: actions/download-artifact@v4
        with:
          name: gkiosk-nixos-iso

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build.${{ github.run_number }}
          name: gKiosk Build ${{ github.run_number }}
          files: |
            gkiosk_1.0.0_amd64.deb
            gkiosk.iso
          generate_release_notes: true
